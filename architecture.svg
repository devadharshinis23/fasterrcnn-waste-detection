<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Faster R-CNN Architecture for Waste Detection</text>

  <!-- shared feature maps arc -->
  <path d="M265 100 L265 62 L650 62 L650 100" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="457" y="55" text-anchor="middle" font-size="12" fill="#555">shared feature maps</text>

  <!-- Row 1 -->
  <rect x="20" y="100" width="120" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="80" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C2C2A">Input image</text>
  <text x="80" y="156" text-anchor="middle" font-size="12" fill="#444">waste photo</text>

  <rect x="180" y="100" width="170" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="265" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#0C447C">Backbone</text>
  <text x="265" y="150" text-anchor="middle" font-size="12" fill="#185FA5">ResNet-50 + FPN</text>
  <text x="265" y="167" text-anchor="middle" font-size="12" fill="#185FA5">(the eyes)</text>

  <rect x="390" y="100" width="150" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="465" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#085041">RPN</text>
  <text x="465" y="150" text-anchor="middle" font-size="12" fill="#0F6E56">suggests rough boxes</text>
  <text x="465" y="167" text-anchor="middle" font-size="12" fill="#0F6E56">(the scout)</text>

  <rect x="580" y="100" width="140" height="80" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="650" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#633806">RoI Align</text>
  <text x="650" y="150" text-anchor="middle" font-size="12" fill="#854F0B">crops each box</text>
  <text x="650" y="167" text-anchor="middle" font-size="12" fill="#854F0B">from the features</text>

  <rect x="760" y="100" width="140" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="830" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#3C3489">Box head</text>
  <text x="830" y="150" text-anchor="middle" font-size="12" fill="#534AB7">fully connected layers</text>
  <text x="830" y="167" text-anchor="middle" font-size="12" fill="#534AB7">(the expert)</text>

  <!-- Row 1 arrows -->
  <line x1="140" y1="140" x2="178" y2="140" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="350" y1="140" x2="388" y2="140" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="540" y1="140" x2="578" y2="140" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="720" y1="140" x2="758" y2="140" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Row 2: two outputs of box head -->
  <line x1="830" y1="180" x2="710" y2="238" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="830" y1="180" x2="905" y2="238" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="610" y="240" width="200" height="60" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>
  <text x="710" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#72243E">Class scores</text>
  <text x="710" y="285" text-anchor="middle" font-size="12" fill="#993556">7 waste groups + background</text>

  <rect x="830" y="240" width="150" height="60" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>
  <text x="905" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#72243E">Box refinement</text>
  <text x="905" y="285" text-anchor="middle" font-size="12" fill="#993556">tighter x1, y1, x2, y2</text>

  <!-- Row 3 -->
  <line x1="710" y1="300" x2="770" y2="348" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="905" y1="300" x2="840" y2="348" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="700" y="350" width="200" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="800" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">NMS + score filter</text>
  <text x="800" y="395" text-anchor="middle" font-size="12" fill="#444">remove duplicate boxes</text>

  <line x1="700" y1="380" x2="622" y2="380" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="400" y="350" width="220" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="510" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#27500A">Final detections</text>
  <text x="510" y="395" text-anchor="middle" font-size="12" fill="#3B6D11">box + class + confidence</text>

  <!-- Footer note -->
  <text x="20" y="445" font-size="12" fill="#555">Transfer learning: backbone, RPN and box head start from COCO-pretrained weights; only the last layer is replaced for 7 classes + background.</text>
</svg>
